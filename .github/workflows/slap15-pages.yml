name: Deploy SLAP 15 Preview

on:
  push:
    branches: ["slap-15-app"]
    paths:
      - "slap-15/**"
      - ".github/workflows/slap15-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "slap15-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./slap-15"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
