name: Deploy SLAP 15 Preview

on:
  push:
    branches: ["slap-15-app"]
    paths:
      - "slap-15/**"
      - ".github/workflows/slap15-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "slap15-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build preview site
        run: |
          mkdir -p _site/slap-15
          cp -R slap-15/. _site/slap-15/
          printf '<!doctype html><meta charset="utf-8"><title>SLAP 15 Preview</title><p><a href="slap-15/">Open SLAP 15</a></p>' > _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
