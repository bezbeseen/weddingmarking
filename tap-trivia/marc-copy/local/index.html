<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tap Trivia</title></head>
<body style="margin:0">
<script>
(async()=>{
  try{
    const source='https://raw.githubusercontent.com/bezbeseen/weddingmarking/902eb8909f7290f4d205588dd82193d6f905a490/tap-trivia/marc-copy/local/index.html';
    let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Tap Trivia.');return r.text()});

    // Keep the current Tap Trivia fixes.
    html=html.replace('3e1ec156404b2308211625a35ae27e653740dbe6','bc4588b7495749bcfbdb051c4573764e3096e949');
    html=html.replace('8ee0cb7dbfac3eb8ff41eed76a2fd42c6af7d779','3e289771da845d73865e25fe1acf092d32306e71');

    // Patch the final app markup after app.html is fetched.
    const appMarker="    let app=await get('app.html');";
    const appPatch=appMarker+`\n    app=app.replace(/<h1>SLAP 15<\\/h1>/g,'<h1>Tap Trivia</h1>');\n    app=app.replace('Set the level, players, and winning score.','Set the players and winning score.');\n    app=app.replace(/<div class=\"setup-field\"><label for=\"levelSelect\">Question level<\\/label><select id=\"levelSelect\">[\\s\\S]*?<\\/select><\\/div>/,'');`;
    if(!html.includes(appMarker))throw new Error('Could not patch Tap Trivia app markup.');
    html=html.replace(appMarker,appPatch);

    // The existing wrapper adds game mode controls. Make Host mode the default and enabled.
    const afterHostControls="    app=app.replace('<div class=\"name-fields\"','<div class=\"setup-grid\" style=\"margin-top:12px\"><div class=\"setup-field\"><label for=\"gameMode\">Game mode</label><select id=\"gameMode\"><option value=\"reader\">Reader rotation</option><option value=\"host\">Host mode</option></select></div><div class=\"setup-field\"><label for=\"hostName\">Host name</label><input id=\"hostName\" type=\"text\" maxlength=\"24\" value=\"Host\" disabled></div><div class=\"setup-field\" style=\"grid-column:1/-1\"><label for=\"dbUpload\">Question database (optional CSV upload)</label><input id=\"dbUpload\" type=\"file\" accept=\".csv,text/csv\"><div id=\"dbStatus\" style=\"font-size:13px;opacity:.72\">Using the built-in question database.</div></div></div><div class=\"name-fields\"');";
    const hostDefaults=afterHostControls+`\n    app=app.replace('<option value=\"reader\">Reader rotation</option><option value=\"host\">Host mode</option>','<option value=\"host\" selected>Host mode</option><option value=\"reader\">Reader rotation</option>');\n    app=app.replace('value=\"Host\" disabled','value=\"Host\"');`;
    if(!html.includes(afterHostControls))throw new Error('Could not set Host mode default.');
    html=html.replace(afterHostControls,hostDefaults);

    // Patch game.js only after the existing host/upload patches have run.
    const gameDoneMarker="    const miniHook=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/3e1ec156404b2308211625a35ae27e653740dbe6/tap-trivia/marc-copy/local/mini-api-inject.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load mini integration.');return r.text()});";
    const gameFinalPatch=`    // Final Tap Trivia question-flow rules.\n    game=game.replace('  const levelSelect = root.querySelector(\"#levelSelect\");','  const levelSelect = null;');\n    game=game.replace('  levelSelect.addEventListener(\"change\", playUiTap);','');\n    game=game.replace('    const level = levelSelect.value;','    const level = \"all\";');\n    game=game.replace(/    if \\(!level\\) \\{[\\s\\S]*?      return;\\n    \\}\\n/,'');\n    game=game.replace('      activeLevel = level;\\n      questionPool = banks[activeLevel] || [];\\n      persistentQuestionIndex = Math.min(\\n        savedIndexes[activeLevel] || 0,\\n        Math.max(questionPool.length - 1, 0)\\n      );','      activeLevel = \"all\";\\n      questionPool = banks.all || banks.mix || [];\\n      if (!questionPool.length) throw new Error(\"No questions are available.\");\\n      persistentQuestionIndex = Math.floor(Math.random() * questionPool.length);');\n    game=game.replace('      \"Loading \" + (level === \"smart\" ? \"Smart AF\" : level.charAt(0).toUpperCase() + level.slice(1)) + \" questions...\";','      \"Loading all questions...\";');\n    game=game.replace('      activeLevel && names.length\\n        ? (hostMode ? hostName + \" is hosting • \" : names[state.reader] + \" is reading • \") +\\n          (activeLevel === \"smart\" ? \"Smart AF\" : activeLevel.charAt(0).toUpperCase() + activeLevel.slice(1))\\n        : \"Ready\";','      activeLevel && names.length ? (hostMode ? hostName + \" is hosting\" : names[state.reader] + \" is reading\") : \"Ready\";');\n    game=game.replace('      const banks = uploadedBanks || (root.__loadQuestionBanks\\n        ? await root.__loadQuestionBanks(level)\\n        : root.__questionBanks);','      const banks = uploadedBanks ? { all: buildTapTriviaSequence(uploadedBanks.mix || []) } : (root.__loadQuestionBanks ? await root.__loadQuestionBanks(\"all\") : root.__questionBanks);');\n    game=game.replace('  function currentQuestion() {','  function buildTapTriviaSequence(source) {\\n    const input=(source||[]).map((q,i)=>({...q,__sourceRow:Number.isFinite(Number(q.__sourceRow))?Number(q.__sourceRow):(Number.isFinite(Number(q.order))?Number(q.order):i),category:q.category||q.assigned_category||\"General Knowledge\",subject:q.subject||q.topic||q.subcategory||q.category||q.assigned_category||\"General Knowledge\"}));\\n    const shuffle=a=>{const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};\\n    let best=[];\\n    for(let attempt=0;attempt<40;attempt++){\\n      const remaining=shuffle(input),out=[],lastSourceByCategory=new Map();\\n      while(remaining.length){\\n        let pick=-1;\\n        for(let i=0;i<remaining.length;i++){\\n          const c=remaining[i],n=out.length;\\n          const sameSubjectRun=n>=2&&out[n-1].subject===c.subject&&out[n-2].subject===c.subject;\\n          const prev=lastSourceByCategory.get(c.category);\\n          const rowGapOk=prev==null||Math.abs(c.__sourceRow-prev)>=50;\\n          if(!sameSubjectRun&&rowGapOk){pick=i;break;}\\n        }\\n        if(pick<0)break;\\n        const q=remaining.splice(pick,1)[0];out.push(q);lastSourceByCategory.set(q.category,q.__sourceRow);\\n      }\\n      if(out.length>best.length)best=out;\\n      if(out.length===input.length)return out;\\n    }\\n    throw new Error(\"The database cannot satisfy the 50-row category spacing rule for every question.\");\\n  }\\n\\n  function currentQuestion() {');\n    game=game.replace(/<div class=\"brand\">SLAP 15<\\/div>/g,'<div class=\"brand\">Tap Trivia</div>');\n\n`+gameDoneMarker;
    if(!html.includes(gameDoneMarker))throw new Error('Could not patch Tap Trivia question flow.');
    html=html.replace(gameDoneMarker,gameFinalPatch);

    // Replace the generated level banks with one all-question database that preserves
    // category/subject/source-row metadata, then prebuild a constrained sequence.
    const assetsMarker="    const assets=await Promise.all(assetNames.map(get));";
    const loaderPatch=assetsMarker+`\n    const loaderIndex=assetNames.indexOf('questions-loader.js');\n    assets[loaderIndex]=\`(()=>{\n      const root=document.getElementById('slap15');if(!root)return;let cache=null,pending=null;\n      const shuffle=a=>{const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};\n      function sequence(source){\n        const input=source.map((q,i)=>({...q,__sourceRow:Number.isFinite(Number(q.__sourceRow))?Number(q.__sourceRow):i,category:q.category||q.assigned_category||'General Knowledge',subject:q.subject||q.topic||q.subcategory||q.category||q.assigned_category||'General Knowledge'}));\n        let best=[];\n        for(let attempt=0;attempt<40;attempt++){\n          const remaining=shuffle(input),out=[],lastSourceByCategory=new Map();\n          while(remaining.length){let pick=-1;for(let i=0;i<remaining.length;i++){const c=remaining[i],n=out.length;const sameSubjectRun=n>=2&&out[n-1].subject===c.subject&&out[n-2].subject===c.subject;const prev=lastSourceByCategory.get(c.category);if(!sameSubjectRun&&(prev==null||Math.abs(c.__sourceRow-prev)>=50)){pick=i;break;}}if(pick<0)break;const q=remaining.splice(pick,1)[0];out.push(q);lastSourceByCategory.set(q.category,q.__sourceRow);}if(out.length>best.length)best=out;if(out.length===input.length)return out;}\n        throw new Error('The built-in database cannot satisfy the 50-row category spacing rule for every question.');\n      }\n      async function load(){if(cache)return cache;if(pending)return pending;pending=(async()=>{if(!('DecompressionStream' in window))throw new Error('This browser cannot open the question data.');const encoded=(window.SLAP15_DATA||'').replace(/\\s+/g,'');if(!encoded)throw new Error('Question data did not load. Refresh and try again.');const binary=atob(encoded),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const raw=JSON.parse(await new Response(stream).text());const flattened=raw.flat().map((q,i)=>{if(Array.isArray(q))return {question:q[0],answer:q[1],__sourceRow:i};return {...q,answer:q.answer||q.answers,category:q.category||q.assigned_category,subject:q.subject||q.topic||q.subcategory,__sourceRow:i};}).filter(q=>q&&q.question&&q.answer);const unique=[...new Map(flattened.map(q=>[String(q.question).trim().toLowerCase(),q])).values()];const all=sequence(unique);cache={all,mix:all};root.__questionBanks=cache;if(root.__setQuestionBanks)root.__setQuestionBanks(cache);return cache;})();try{return await pending}finally{pending=null}}\n      root.__loadQuestionBanks=load;\n    })();\`;`;
    if(!html.includes(assetsMarker))throw new Error('Could not install all-question loader.');
    html=html.replace(assetsMarker,loaderPatch);

    // Embed all four mini games into the final document.
    const oldFetch="    const miniGameCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/3e289771da845d73865e25fe1acf092d32306e71/tap-trivia/marc-copy/local/mini-games.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load mini games.');return r.text()});";
    const newFetch=oldFetch+"\n    const priceGuessCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/73c562df5ff6927e0ecd2e4848ff4ecfa8068bf6/tap-trivia/marc-copy/local/price-guess-plugin.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Price Guess.');return r.text()});\n    const whatCameFirstCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/03a5bb8afe4232b9144b9c7ac24743df496586be/tap-trivia/marc-copy/local/what-came-first-plugin.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load What Came First.');return r.text()});\n    const fullRotationCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/e23e2952fcf8327c42601e47dd7baa75a0b1e480/tap-trivia/marc-copy/local/price-guess-rotation.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load four-game rotation.');return r.text()});";
    if(!html.includes(oldFetch))throw new Error('Could not patch mini-game fetch block.');
    html=html.replace(oldFetch,newFetch);

    const oldScripts="    const scripts=assets.map(x=>'<script>'+esc(x)+'<\\/script>').join('\\n')+'\\n<script>'+esc(game)+'<\\/script>\\n<script>'+esc(numericCatalogCode)+'<\\/script>\\n<script>'+esc(miniGameCode)+'<\\/script>';";
    const newScripts="    const scripts=assets.map(x=>'<script>'+esc(x)+'<\\/script>').join('\\n')+'\\n<script>'+esc(game)+'<\\/script>\\n<script>'+esc(numericCatalogCode)+'<\\/script>\\n<script>'+esc(miniGameCode)+'<\\/script>\\n<script>'+esc(priceGuessCode)+'<\\/script>\\n<script>'+esc(whatCameFirstCode)+'<\\/script>\\n<script>'+esc(fullRotationCode)+'<\\/script>';";
    if(!html.includes(oldScripts))throw new Error('Could not patch final mini-game script block.');
    html=html.replace(oldScripts,newScripts);

    document.open();document.write(html);document.close();
  }catch(err){document.body.innerHTML='<pre style="padding:20px;font-family:system-ui;white-space:pre-wrap">'+String(err&&err.stack||err)+'</pre>';}
})();
</script>
</body>
</html>
