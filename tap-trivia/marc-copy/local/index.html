<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tap Trivia</title></head>
<body style="margin:0">
<script>
(async()=>{
  try{
    const source='https://raw.githubusercontent.com/bezbeseen/weddingmarking/902eb8909f7290f4d205588dd82193d6f905a490/tap-trivia/marc-copy/local/index.html';
    let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Tap Trivia.');return r.text()});

    html=html.replace('3e1ec156404b2308211625a35ae27e653740dbe6','bc4588b7495749bcfbdb051c4573764e3096e949');
    html=html.replace('8ee0cb7dbfac3eb8ff41eed76a2fd42c6af7d779','3e289771da845d73865e25fe1acf092d32306e71');

    const oldBankLoad="    game=replace(game,'      const banks = root.__loadQuestionBanks\\n        ? await root.__loadQuestionBanks(level)\\n        : root.__questionBanks;','      const banks = uploadedBanks || (root.__loadQuestionBanks\\n        ? await root.__loadQuestionBanks(level)\\n        : root.__questionBanks);','uploaded banks');";
    const newBankLoad="    game=replace(game,'      const banks = root.__loadQuestionBanks\\n        ? await root.__loadQuestionBanks(level)\\n        : root.__questionBanks;','      const loadedBanks = uploadedBanks || (root.__loadQuestionBanks\\n        ? await root.__loadQuestionBanks(level)\\n        : root.__questionBanks);\\n      const banks = {};\\n      Object.entries(loadedBanks || {}).forEach(([key, list]) => {\\n        banks[key] = Array.isArray(list) ? list.filter(q => !/\\\\batomic\\\\s+number\\\\b/i.test(String(q && q.question || \\\"\\\"))) : list;\\n      });','uploaded banks');";
    if(!html.includes(oldBankLoad)) throw new Error('Could not patch atomic-number filter.');
    html=html.replace(oldBankLoad,newBankLoad);

    const miniHookLine="    const miniHook=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/3e1ec156404b2308211625a35ae27e653740dbe6/tap-trivia/marc-copy/local/mini-api-inject.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load mini integration.');return r.text()});";
    const scoringPatch="    game=game.replace('      const nextPenalty = state.misses[i] + 1;','      const nextPenalty = 1;');\n    game=game.replace('    const penalty = state.misses[i];\\n    state.scores[i] -= penalty;','    const penalty = 1;\\n    state.scores[i] -= 1;');\n\n"+miniHookLine;
    if(!html.includes(miniHookLine)) throw new Error('Could not patch main-game scoring.');
    html=html.replace(miniHookLine,scoringPatch);

    const oldFetch="    const miniGameCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/3e289771da845d73865e25fe1acf092d32306e71/tap-trivia/marc-copy/local/mini-games.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load mini games.');return r.text()});";
    const newFetch=oldFetch+"\n    const closestWinsCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/tap-trivia/tap-trivia/marc-copy/local/closest-wins-plugin.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Closest Wins.');return r.text()});\n    const priceGuessCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/73c562df5ff6927e0ecd2e4848ff4ecfa8068bf6/tap-trivia/marc-copy/local/price-guess-plugin.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Price Guess.');return r.text()});\n    let whatCameFirstCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/tap-trivia/tap-trivia/marc-copy/local/what-came-first-plugin.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load What Came First.');return r.text()});\n    whatCameFirstCode=whatCameFirstCode.replace(/  function pickPair\\(category\\)\\{[\\s\\S]*?\\n  \\}\\n\\n  function launch\\(hostApi\\)/,`  function pickPair(category){\\n    const bank=EVENTS[category]||[];\\n    let used=usedByCategory.get(category);\\n    if(!used){used=new Set();usedByCategory.set(category,used);}\\n    let available=bank.map((e,i)=>({e,i})).filter(x=>!used.has(x.i));\\n    if(available.length<2){used.clear();available=bank.map((e,i)=>({e,i}));}\\n    available=shuffle(available);\\n\\n    const stop=new Set(['the','a','an','and','or','of','to','in','on','for','with','at','from','by','was','were','is','are','became','began','ended','first','united','states','american']);\\n    const tokens=text=>new Set(String(text).toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\\\\s+/).filter(w=>w.length>3&&!stop.has(w)));\\n    const tooRelated=(a,b)=>{\\n      const A=tokens(a),B=tokens(b);\\n      const common=[...A].filter(w=>B.has(w));\\n      if(common.length>=2)return true;\\n      const al=String(a).toLowerCase(),bl=String(b).toLowerCase();\\n      const subjects=['civil war','world war','beatles','super bowl','olympic','olympics','berlin wall','apollo','moon','disneyland','michael jackson','taylor swift','facebook','google','youtube','nba','nfl','world cup'];\\n      return subjects.some(s=>al.includes(s)&&bl.includes(s));\\n    };\\n\\n    for(const first of available){\\n      const candidates=shuffle(available.filter(x=>x.i!==first.i&&x.e[1]!==first.e[1]));\\n      const preferred=candidates.filter(x=>{const gap=Math.abs(x.e[1]-first.e[1]);return gap>=3&&gap<=25&&!tooRelated(first.e[0],x.e[0]);});\\n      const fallback=candidates.filter(x=>{const gap=Math.abs(x.e[1]-first.e[1]);return gap>=2&&gap<=35&&!tooRelated(first.e[0],x.e[0]);});\\n      const second=(preferred[0]||fallback[0]);\\n      if(!second)continue;\\n      used.add(first.i);used.add(second.i);\\n      return {event_A:first.e[0],year_A:first.e[1],event_B:second.e[0],year_B:second.e[1],correct_first:first.e[1]<second.e[1]?'A':'B',category};\\n    }\\n    return null;\\n  }\\n\\n  function launch(hostApi)`);\n    whatCameFirstCode=whatCameFirstCode.replace(/    function chooseCategory\\(\\)\\{[\\s\\S]*?\\n    \\}\\n\\n    function showTurn\\(\\)/,`    function chooseCategory(){\\n      if(turn>=players.length){finish();return;}\\n      const categories=shuffle(Object.keys(EVENTS));\\n      current=null;\\n      for(const category of categories){\\n        current=pickPair(category);\\n        if(current)break;\\n      }\\n      showTurn();\\n    }\\n\\n    function showTurn()`);\n    const rapidFireCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/tap-trivia/tap-trivia/marc-copy/local/rapid-fire-plugin.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Rapid Fire.');return r.text()});\n    const fullRotationCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/tap-trivia/tap-trivia/marc-copy/local/price-guess-rotation.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load four-game rotation.');return r.text()});\n    const mainRulesCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/tap-trivia/tap-trivia/marc-copy/local/tap-trivia-main-rules.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Tap Trivia rules.');return r.text()});";
    if(!html.includes(oldFetch)) throw new Error('Could not patch mini-game fetch block.');
    html=html.replace(oldFetch,newFetch);

    const oldScripts="    const scripts=assets.map(x=>'<script>'+esc(x)+'<\\/script>').join('\\n')+'\\n<script>'+esc(game)+'<\\/script>\\n<script>'+esc(numericCatalogCode)+'<\\/script>\\n<script>'+esc(miniGameCode)+'<\\/script>';";
    const newScripts="    const scripts=assets.map(x=>'<script>'+esc(x)+'<\\/script>').join('\\n')+'\\n<script>'+esc(game)+'<\\/script>\\n<script>'+esc(numericCatalogCode)+'<\\/script>\\n<script>'+esc(miniGameCode)+'<\\/script>\\n<script>'+esc(closestWinsCode)+'<\\/script>\\n<script>'+esc(priceGuessCode)+'<\\/script>\\n<script>'+esc(whatCameFirstCode)+'<\\/script>\\n<script>'+esc(rapidFireCode)+'<\\/script>\\n<script>'+esc(fullRotationCode)+'<\\/script>\\n<script>'+esc(mainRulesCode)+'<\\/script>';";
    if(!html.includes(oldScripts)) throw new Error('Could not patch final script block.');
    html=html.replace(oldScripts,newScripts);

    document.open();document.write(html);document.close();
  }catch(err){document.body.innerHTML='<pre style="padding:20px;font-family:system-ui;white-space:pre-wrap">'+String(err&&err.stack||err)+'</pre>';}
})();
</script>
</body>
</html>
