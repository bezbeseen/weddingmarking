<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tap Trivia</title></head>
<body style="margin:0">
<script>
(async()=>{
  try{
    const source='https://raw.githubusercontent.com/bezbeseen/weddingmarking/b7c0c3d7dedaca1459bad5af441d41389ae64b6c/tap-trivia/marc-copy/local/index.html';
    let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Tap Trivia.');return r.text()});
    html=html.replace(
      "const miniHookLine=\"    const miniHook=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/3e1ec156404b2308211625a35ae27e653740dbe6/tap-trivia/marc-copy/local/mini-api-inject.js'",
      "const miniHookLine=\"    const miniHook=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/bc4588b7495749bcfbdb051c4573764e3096e949/tap-trivia/marc-copy/local/mini-api-inject.js'"
    );
    document.open();document.write(html);document.close();
  }catch(err){document.body.innerHTML='<pre style="padding:20px;font-family:system-ui;white-space:pre-wrap">'+String(err&&err.stack||err)+'</pre>';}
})();
</script>
</body>
</html>
