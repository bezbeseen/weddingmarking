<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tap Trivia</title></head>
<body style="margin:0">
<script>
(async()=>{
  try{
    const source='https://raw.githubusercontent.com/bezbeseen/weddingmarking/902eb8909f7290f4d205588dd82193d6f905a490/tap-trivia/marc-copy/local/index.html';
    let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Tap Trivia.');return r.text()});

    html=html.replace('3e1ec156404b2308211625a35ae27e653740dbe6','bc4588b7495749bcfbdb051c4573764e3096e949');
    html=html.replace('8ee0cb7dbfac3eb8ff41eed76a2fd42c6af7d779','3e289771da845d73865e25fe1acf092d32306e71');

    const oldBankLoad="    game=replace(game,'      const banks = root.__loadQuestionBanks\\n        ? await root.__loadQuestionBanks(level)\\n        : root.__questionBanks;','      const banks = uploadedBanks || (root.__loadQuestionBanks\\n        ? await root.__loadQuestionBanks(level)\\n        : root.__questionBanks);','uploaded banks');";
    const newBankLoad="    game=replace(game,'      const banks = root.__loadQuestionBanks\\n        ? await root.__loadQuestionBanks(level)\\n        : root.__questionBanks;','      const loadedBanks = uploadedBanks || (root.__loadQuestionBanks\\n        ? await root.__loadQuestionBanks(level)\\n        : root.__questionBanks);\\n      const banks = {};\\n      Object.entries(loadedBanks || {}).forEach(([key, list]) => {\\n        banks[key] = Array.isArray(list) ? list.filter(q => !/\\\\batomic\\\\s+number\\\\b/i.test(String(q && q.question || \\\"\\\"))) : list;\\n      });','uploaded banks');";
    if(!html.includes(oldBankLoad)) throw new Error('Could not patch atomic-number filter.');
    html=html.replace(oldBankLoad,newBankLoad);

    const mcHook="    const miniHook=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/3e1ec156404b2308211625a35ae27e653740dbe6/tap-trivia/marc-copy/local/mini-api-inject.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load mini integration.');return r.text()});";
    const mcPatch=`    // Build relevant multiple-choice answers. Database-provided choices always win.\n    game=game.replace(/  function buildChoices\\(question\\) \\{[\\s\\S]*?\\n  \\}\\n\\n  function buildNameFields\\(\\)/, \\`  function buildChoices(question) {\n    const correct = String(question.answer || '').trim();\n    const clean = (s) => String(s || '').trim();\n    const norm = (s) => clean(s).toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9]+/g, ' ').trim();\n    const unique = (arr) => { const seen=new Set(); return arr.filter(x=>{const k=norm(x);if(!k||k===norm(correct)||seen.has(k))return false;seen.add(k);return true;}); };\n\n    // If the source row is already multiple choice, preserve those authored choices.\n    let authored = [];\n    if (Array.isArray(question.distractors)) authored = question.distractors.map(clean);\n    authored = authored.concat([question.option_a,question.option_b,question.option_c,question.option_d].map(clean));\n    authored = unique(authored);\n    if (authored.length >= 3) {\n      const chosen=authored.slice(0,3);\n      return seededShuffle([{text:correct,correct:true}].concat(chosen.map(text=>({text,correct:false}))),hashSeed(question.question + correct + 'dbmc'));\n    }\n\n    const q = norm(question.question);\n    const category = norm(question.category || question.assigned_category || '');\n    const intent = (text) => {\n      const t=norm(text);\n      if (/\\b(who wrote|which author|author of|written by|novelist|playwright)\\b/.test(t)) return 'author';\n      if (/\\b(who directed|director of|directed by)\\b/.test(t)) return 'director';\n      if (/\\b(who played|actor|actress|portrayed|starred)\\b/.test(t)) return 'actor';\n      if (/\\b(what year|which year|when did|when was|in what year)\\b/.test(t)) return 'year';\n      if (/\\b(capital)\\b/.test(t)) return 'capital';\n      if (/\\b(which|what|in what) (u s )?state\\b|\\bstate is\\b/.test(t)) return 'state';\n      if (/\\b(which|what|in what) country\\b|\\bnationality\\b/.test(t)) return 'country';\n      if (/\\b(which|what|in what) city\\b|\\bcity is\\b/.test(t)) return 'city';\n      if (/\\bchemical symbol\\b/.test(t)) return 'chemical-symbol';\n      if (/\\bhow many\\b|\\bhow much\\b|\\bnumber of\\b/.test(t)) return 'number';\n      if (/^who\\b/.test(t)) return 'person';\n      return 'general';\n    };\n    const answerShape = (a) => {\n      const s=clean(a);\n      if (/^(18|19|20)\\d{2}$/.test(s)) return 'year';\n      if (/^-?\\d+(?:[.,]\\d+)?(?:%| degrees?)?$/.test(s.toLowerCase())) return 'number';\n      if (/^[A-Z][a-z]+(?: [A-Z][a-z.'-]+){1,4}$/.test(s)) return 'proper-name';\n      if (/^[A-Z][a-z]+$/.test(s)) return 'proper-word';\n      return 'text';\n    };\n    const wanted=intent(question.question), shape=answerShape(correct);\n    const pool=seededShuffle(questionPool,hashSeed(question.question + (question.order||0) + 'smartmc'));\n    const scored=[];\n    for(const item of pool){\n      const text=clean(item.answer); if(!text||norm(text)===norm(correct))continue;\n      let score=0;\n      const otherIntent=intent(item.question||'');\n      const otherCat=norm(item.category||item.assigned_category||'');\n      const otherShape=answerShape(text);\n      if(wanted!=='general' && otherIntent===wanted) score+=8;\n      if(category && otherCat===category) score+=4;\n      if(otherShape===shape) score+=3;\n      if(wanted==='year' && otherShape!=='year') continue;\n      if(wanted==='number' && otherShape!=='number') continue;\n      if(['author','director','actor','person'].includes(wanted) && !['proper-name','proper-word'].includes(otherShape)) continue;\n      if(['capital','state','country','city'].includes(wanted) && !['proper-name','proper-word'].includes(otherShape)) continue;\n      scored.push({text,score});\n    }\n    scored.sort((a,b)=>b.score-a.score);\n    let distractors=unique(authored.concat(scored.filter(x=>x.score>=3).map(x=>x.text))).slice(0,3);\n    if(distractors.length<3) distractors=unique(distractors.concat(scored.map(x=>x.text))).slice(0,3);\n    // As a final safeguard, never mix numeric and nonnumeric answer types.\n    if(distractors.length<3){\n      const sameShape=pool.map(x=>clean(x.answer)).filter(x=>answerShape(x)===shape);\n      distractors=unique(distractors.concat(sameShape)).slice(0,3);\n    }\n    while(distractors.length<3) distractors.push('None of these');\n    return seededShuffle([{text:correct,correct:true}].concat(distractors.map(text=>({text,correct:false}))),hashSeed(question.answer + 'mc'));\n  }\n\n  function buildNameFields()\\`);\n\n    // Preserve multiple-choice options from built-in source objects when the loader has them.\n    const li=assetNames.indexOf('questions-loader.js');\n    if(li>=0){\n      assets[li]=assets[li].replace('out.push({question,answer:item.answer,difficulty:level,order:out.length+1});', 'out.push({...item,question,answer:item.answer,difficulty:level,order:out.length+1,distractors:item.distractors||[item.option_a,item.option_b,item.option_c,item.option_d].filter(Boolean)});');\n    }\n\n${mcHook}`;
    if(!html.includes(mcHook)) throw new Error('Could not patch multiple-choice logic.');
    html=html.replace(mcHook,mcPatch);

    const oldFetch="    const miniGameCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/3e289771da845d73865e25fe1acf092d32306e71/tap-trivia/marc-copy/local/mini-games.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load mini games.');return r.text()});";
    const newFetch=oldFetch+"\n    const closestWinsCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/tap-trivia/tap-trivia/marc-copy/local/closest-wins-plugin.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Closest Wins.');return r.text()});\n    const priceGuessCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/73c562df5ff6927e0ecd2e4848ff4ecfa8068bf6/tap-trivia/marc-copy/local/price-guess-plugin.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Price Guess.');return r.text()});\n    const whatCameFirstCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/03a5bb8afe4232b9144b9c7ac24743df496586be/tap-trivia/marc-copy/local/what-came-first-plugin.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load What Came First.');return r.text()});\n    const rapidFireCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/tap-trivia/tap-trivia/marc-copy/local/rapid-fire-plugin.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Rapid Fire.');return r.text()});\n    const fullRotationCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/tap-trivia/tap-trivia/marc-copy/local/price-guess-rotation.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load four-game rotation.');return r.text()});\n    const mainRulesCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/tap-trivia/tap-trivia/marc-copy/local/tap-trivia-main-rules.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Tap Trivia rules.');return r.text()});";
    if(!html.includes(oldFetch)) throw new Error('Could not patch mini-game fetch block.');
    html=html.replace(oldFetch,newFetch);

    const oldScripts="    const scripts=assets.map(x=>'<script>'+esc(x)+'<\\/script>').join('\\n')+'\\n<script>'+esc(game)+'<\\/script>\\n<script>'+esc(numericCatalogCode)+'<\\/script>\\n<script>'+esc(miniGameCode)+'<\\/script>';";
    const newScripts="    const scripts=assets.map(x=>'<script>'+esc(x)+'<\\/script>').join('\\n')+'\\n<script>'+esc(game)+'<\\/script>\\n<script>'+esc(numericCatalogCode)+'<\\/script>\\n<script>'+esc(miniGameCode)+'<\\/script>\\n<script>'+esc(closestWinsCode)+'<\\/script>\\n<script>'+esc(priceGuessCode)+'<\\/script>\\n<script>'+esc(whatCameFirstCode)+'<\\/script>\\n<script>'+esc(rapidFireCode)+'<\\/script>\\n<script>'+esc(fullRotationCode)+'<\\/script>\\n<script>'+esc(mainRulesCode)+'<\\/script>';";
    if(!html.includes(oldScripts)) throw new Error('Could not patch final script block.');
    html=html.replace(oldScripts,newScripts);

    document.open();document.write(html);document.close();
  }catch(err){document.body.innerHTML='<pre style="padding:20px;font-family:system-ui;white-space:pre-wrap">'+String(err&&err.stack||err)+'</pre>';}
})();
</script>
</body>
</html>
