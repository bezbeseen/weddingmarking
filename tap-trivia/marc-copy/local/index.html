<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SLAP 15 — Mini Games</title></head>
<body style="margin:0">
<script>
(async()=>{
  try{
    const source='https://raw.githubusercontent.com/bezbeseen/weddingmarking/902eb8909f7290f4d205588dd82193d6f905a490/tap-trivia/marc-copy/local/index.html';
    let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Tap Trivia.');return r.text()});
    html=html.replace('3e1ec156404b2308211625a35ae27e653740dbe6','bc4588b7495749bcfbdb051c4573764e3096e949');
    html=html.replace('8ee0cb7dbfac3eb8ff41eed76a2fd42c6af7d779','59379d36515648b44336ef21494977684b2897de');

    const pluginCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/81de614afd96f8375e0adbfef9c0afee4f62a223/tap-trivia/marc-copy/local/higher-lower-plugin.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Higher / Lower plugin.');return r.text()});
    const integrationCode=await fetch('https://raw.githubusercontent.com/bezbeseen/weddingmarking/5b97712aacc60b3328345646275fa0e041282e74/tap-trivia/marc-copy/local/higher-lower-host-integration.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Higher / Lower host integration.');return r.text()});
    const escScript=s=>s.replace(/<\/script/gi,'<\\/script');
    const extraScripts='<script>'+escScript(pluginCode)+'<\/script>\n<script>'+escScript(integrationCode)+'<\/script>';
    const innerWrite='document.open();document.write(app);document.close();';
    const patchedWrite='app=app.replace(/<\\/div>\\s*$/i,'+JSON.stringify(extraScripts)+'+\'</div>\');document.open();document.write(app);document.close();';
    if(!html.includes(innerWrite))throw new Error('Could not attach Higher / Lower integration.');
    html=html.replace(innerWrite,patchedWrite);

    document.open();document.write(html);document.close();
  }catch(err){document.body.innerHTML='<pre style="padding:20px;font-family:system-ui;white-space:pre-wrap">'+String(err&&err.stack||err)+'</pre>';}
})();
</script>
</body>
</html>
