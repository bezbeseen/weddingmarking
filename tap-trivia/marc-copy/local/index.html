<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tap Trivia</title></head>
<body style="margin:0">
<script>
(async()=>{
  try{
    const source='https://raw.githubusercontent.com/bezbeseen/weddingmarking/b7c0c3d7dedaca1459bad5af441d41389ae64b6c/tap-trivia/marc-copy/local/index.html';
    let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load Tap Trivia.');return r.text()});

    // Remove the old runtime scoring guard that was breaking the whole loader.
    html=html.replace(/\n    const miniHookLine=[\s\S]*?html=html\.replace\(miniHookLine,scoringPatch\);\n/,'\n');

    // Make the fixed -1 penalty directly inside the game source while the loader has access to `game`.
    const oldFetchMarker='    const oldFetch="    const miniGameCode=await fetch(';
    const scoringLines="    game=game.replace('      const nextPenalty = state.misses[i] + 1;','      const nextPenalty = 1;');\n    game=game.replace('    const penalty = state.misses[i];\\n    state.scores[i] -= penalty;','    const penalty = 1;\\n    state.scores[i] -= 1;');\n\n";
    if(!html.includes(oldFetchMarker)) throw new Error('Could not locate game patch point.');
    html=html.replace(oldFetchMarker,scoringLines+oldFetchMarker);

    // Always use the current mini-game integration, which contains the smart multiple-choice logic.
    html=html.replace(/https:\/\/raw\.githubusercontent\.com\/bezbeseen\/weddingmarking\/[a-f0-9]+\/tap-trivia\/marc-copy\/local\/mini-api-inject\.js/g,
      'https://raw.githubusercontent.com/bezbeseen/weddingmarking/tap-trivia/tap-trivia/marc-copy/local/mini-api-inject.js');

    document.open();document.write(html);document.close();
  }catch(err){document.body.innerHTML='<pre style="padding:20px;font-family:system-ui;white-space:pre-wrap">'+String(err&&err.stack||err)+'</pre>';}
})();
</script>
</body>
</html>
