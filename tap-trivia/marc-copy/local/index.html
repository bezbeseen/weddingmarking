<body style="margin:0">
<script>
(async()=>{

      s.async=false;
      s.onload=resolve;
      s.onerror=()=>reject(new Error('Could not load '+src));
      document.body.appendChild(s);
    });

  }catch(err){
    document.body.innerHTML='<pre style="padding:20px;font-family:system-ui;white-space:pre-wrap">'+String(err&&err.stack||err)+'</pre>';

})();
</script>
