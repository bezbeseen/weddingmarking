<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SLAP 15 — Mini Games</title>
</head>
<body style="margin:0">
<script>
(async()=>{
  const rollback='https://raw.githubusercontent.com/bezbeseen/weddingmarking/72735a3d769cb0731bfb1ab1f95ec18c04d59a27/tap-trivia/marc-copy/local/index.html';
  const miniUrl='https://raw.githubusercontent.com/bezbeseen/weddingmarking/210239c01e302d86e0fa32c5604ed2da20efbfae/tap-trivia/marc-copy/local/mini-games.js';
  try{
    let html=await fetch(rollback,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load rolled-back game.');return r.text()});

    const insertion=`
    game=game.replace('  let persistentQuestionIndex = 0;','  let persistentQuestionIndex = 0;\\n  let completedQuestions = 0;');
    game=game.replace('    resetQuestionFlags();\\n  }\\n\\n  function snapshot()','    resetQuestionFlags();\\n    completedQuestions += 1;\\n    if (completedQuestions % 3 === 0 && !state.winner) setTimeout(() => root.__launchMiniGame && root.__launchMiniGame(), 0);\\n  }\\n\\n  function snapshot()');
    game=game.replace('      state = emptyState(count);\\n      history = [];','      state = emptyState(count);\\n      history = [];\\n      completedQuestions = 0;');
    game=game.replace('  buildNameFields();\\n  updateDefaultWinScore();\\n  render();',\`  root.__miniGameAPI = {
    getPlayers: () => names.map((name, index) => ({ index, name, avatar: avatars[index] || AVATARS[index % AVATARS.length], score: state.scores[index] || 0 })),
    addPoints: (index, points) => {
      if (index < 0 || index >= state.scores.length) return;
      state.scores[index] = (state.scores[index] || 0) + points;
      if (state.scores[index] >= winTarget) { state.winner = { index }; playWinSound(); status.textContent = names[index] + " wins from the mini game!"; }
      render();
    },
    setScore: (index, value) => {
      if (index < 0 || index >= state.scores.length) return;
      state.scores[index] = value;
      if (state.scores[index] >= winTarget) { state.winner = { index }; playWinSound(); status.textContent = names[index] + " wins from the mini game!"; }
      render();
    },
    getLeaderScore: () => state.scores.length ? Math.max(...state.scores) : 0,
    getLastPlaceIndexes: () => {
      if (!state.scores.length) return [];
      const low = Math.min(...state.scores);
      return state.scores.map((score, index) => score === low ? index : -1).filter(index => index >= 0);
    }
  };
  buildNameFields();
  updateDefaultWinScore();
  render();\`);
    const miniGameCode=await fetch('${miniUrl}',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load mini games.');return r.text()});
`;

    html=html.replace('    const assetNames=[', insertion+'\n    const assetNames=[');
    html=html.replace(
      "    const scripts=assets.map(x=>'<script>'+esc(x)+'<\\/script>').join('\\n')+'\\n<script>'+esc(game)+'<\\/script>';",
      "    const scripts=assets.map(x=>'<script>'+esc(x)+'<\\/script>').join('\\n')+'\\n<script>'+esc(game)+'<\\/script>\\n<script>'+esc(miniGameCode)+'<\\/script>';"
    );

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<pre style="padding:20px;font-family:system-ui;white-space:pre-wrap">'+String(err&&err.stack||err)+'</pre>';
  }
})();
</script>
</body>
</html>
